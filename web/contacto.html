  <main class="contenido">
    <h1>Kontaktua</h1>
    <p>Galderaren bat duzu? Idatzi iezaguzu eta ahalik eta azkarren erantzungo dizugu.</p>



    <form class="formulario" id="formularioa" action="#" method="post">
      <label for="izena">Izena</label>
      <input type="text" id="izena" name="izena" placeholder="Zure izena">

      <label for="email">Posta elektronikoa</label>
      <input type="text" id="email" name="email" placeholder="zurepostak@adibidea.com">

      <label for="telefonoa">Telefonoa</label>
      <input type="tel" id="telefonoa" name="telefonoa" placeholder="600000000">

      <label for="posta-kodea">Posta-kodea</label>
      <input type="text" id="posta-kodea" name="posta-kodea" placeholder="48340">

      <p>Mezu mota:</p>
      <label><input type="radio" id="zalantza" name="mezu_mota" value="zalantza"> Zalantza</label>
      <label><input type="radio" id="iradokizuna" name="mezu_mota" value="iradokizuna"> Iradokizuna</label>
      <label><input type="radio" id="kexa" name="mezu_mota" value="kexa"> Kexa</label>
      <label><input type="radio" id="beste" name="mezu_mota" value="beste"> Beste batzuk</label>


      <label for="mezua">Mezua</label>
      <textarea id="mezua" name="mezua" rows="5" placeholder="Kontatu iezaguzu zer behar duzun"></textarea>

      <label class="privacidad">
        <input type="checkbox" id="privacidad" name="privacidad">
        Pribatutasun politika irakurri dut eta onartzen dut (Datuen babesa)
      </label>

      <button class="boton" type="submit">Bidali mezua</button>
    </form>
  </main>
