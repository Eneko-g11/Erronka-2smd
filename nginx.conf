# La intranet se sirve por HTTP en 80 y 8080 (publicado como 443 en el host).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/intranet;
    index index.html;
    absolute_redirect off;

    # Envía las rutas de la web pública a web/ si no existen en intranet/.
    location / {
        try_files $uri $uri/ @web;
    }
    location @web {
        root /usr/share/nginx/html/web;
        try_files $uri =404;
    }

    location = /web { return 301 /web/; }
    location /web/ {
        alias /usr/share/nginx/html/web/;
        index index.html;
    }

    location = /login.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /login.html =404;
    }

    location = /code { return 301 /code/; }
    location /code/ {
        set $destino code:8443;
        rewrite ^/code(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$destino;
    }

    location = /portainer { return 301 /portainer/; }
    location /portainer/ {
        set $destino portainer:9000;
        rewrite ^/portainer(/.*)$ $1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$destino;
    }
    location = /whoami { return 301 /whoami/; }
    location /whoami/ {
        set $destino whoami:80;
        rewrite ^/whoami(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://$destino;
    }

    location = /duplicati { return 301 /duplicati/; }
    location /duplicati/ {
        set $destino duplicati:8200;
        rewrite ^/duplicati(/.*)$ $1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /duplicati;
        proxy_pass http://$destino;
    }
}
