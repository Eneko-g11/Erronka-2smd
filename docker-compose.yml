services:
  intranet:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html/web:ro
      - ./intranet:/usr/share/nginx/html/intranet:ro
    depends_on:
      - whoami
      - duplicati

  web-a:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro

  code:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Madrid
    volumes:
      - code_config:/config
      - ./:/config/workspace

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  whoami:
    image: traefik/whoami
    restart: unless-stopped

  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Madrid
      DUPLICATI__WEBSERVICE_INTERFACE: any
      DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES: "*"
      DUPLICATI__WEBSERVICE_URL_PREFIX: /duplicati
      DUPLICATI__WEBSERVICE_PASSWORD: "1234"
      SETTINGS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    volumes:
      - duplicati_config:/config
      - duplicati_backups:/backups
      - ./intranet:/source:ro

volumes:
  code_config:
    name: erronka-2smd_code_config
  portainer_data:
    name: erronka-2smd_portainer_data
  duplicati_config:
    name: erronka-2smd_duplicati_config_recovery
  duplicati_backups:


